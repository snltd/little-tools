name: Rust Tests
on:
  push:
    branches:
      - main
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/*.rs"
      - .github/workflows/rust-tests.yml
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/*.rs"
      - .github/workflows/rust-tests.yml

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: test-rust
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust Tests
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Install external dependencies
        run: sudo apt-get update && sudo apt-get install -y lame flac ffmpeg mp3val
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: Set up caching
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Set up cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest
      - name: Do a Clippy
        run: cargo clippy
      - name: Run Rust Tests
        run: cargo nextest run --run-ignored=all
